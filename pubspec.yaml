name: cellmeter
description: "CellMeter - Battery Monitor & Analytics. Monitor. Analyze. Optimize."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.5.0

  # Persistence
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

  # Navigation
  go_router: ^18.1.4

  # Charts & UI
  fl_chart: ^1.3.1
  cupertino_icons: ^1.0.8

  # Platform / device
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  permission_handler: ^13.0.2
  flutter_local_notifications: ^23.0.2

  # Utility
  intl: ^0.20.2
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.35.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
